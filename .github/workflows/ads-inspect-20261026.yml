name: 広告追加42件の読み取り検品
on:
  push:
    branches: [google-leads-20261026]
    paths: [.github/workflows/ads-inspect-20261026.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OUT_DIR: 記録/広告追加-${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 既存処理で公式サイトとフォームを確認
        env:
          PART: ${{ matrix.part }}
        run: |
          mkdir -p "$OUT_DIR/出力"
          python3 - <<'PY'
          import json,os,pathlib
          d=json.load(open('広告候補集め/候補化/入力/20261026_MetaGoogle追加42社.json'))
          p=pathlib.Path(os.environ['OUT_DIR'])/'出力'
          for k in ('meta','google'):
              (p/(k+'_候補.json')).write_text(json.dumps(d[k],ensure_ascii=False))
          PY
          node 広告候補集め/meta/公式サイト確定.mjs --per=999 "--shard=$PART/8" "--out=$OUT_DIR/候補.tsv"
      - name: 最新D1をSELECTだけで読み込む
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.150.0 d1 execute line-stock-sales --remote --config=登録/wrangler.jsonc --command="SELECT id,name,legal_name,official_url,form_url,status FROM companies" --json > "$OUT_DIR/D1読取.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['OUT_DIR']);d=json.load(open(p/'D1読取.json'))
          assert d and all(x.get('success') for x in d)
          (p/'sales.json').write_text(json.dumps({'companies':[r for x in d for r in x['results']]},ensure_ascii=False))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('LS_API='+(p/'sales.json').resolve().as_uri()+'\n')
          PY
      - name: 既存処理で重複除外・入力検品・判定（登録送信なし）
        run: |
          python3 登録/流れ.py cands "$OUT_DIR" "$OUT_DIR/候補.tsv"
          node 広告候補集め/候補化/フォーム検品.mjs "$OUT_DIR/cands.json" "$OUT_DIR/results.jsonl" 3 1/1
          python3 登録/流れ.py plan "$OUT_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 広告追加検品-${{ matrix.part }}
          path: ${{ env.OUT_DIR }}/
          retention-days: 14
