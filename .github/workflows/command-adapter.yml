name: 既存フォーム営業ワークフローの起動
on:
  push:
    branches: [google-leads-20261026]
    paths: [.github/営業実行/command.json]
permissions:
  contents: read
  actions: write
concurrency:
  group: google-leads-20261026-command
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 指定済みの既存ワークフローを起動
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          c=json.load(open('.github/営業実行/command.json'))
          assert c['ref']=='google-leads-20261026'
          assert c['workflow'] in ('全部.yml','send.yml')
          inp=c['inputs']
          if c['workflow']=='全部.yml':
              assert inp.get('source')=='file' and inp.get('mode') in ('dry','register')
              assert set(inp)<=set(('source','q','mode'))
              assert inp['q'].startswith(('登録/再開/','広告候補集め/候補化/入力/'))
              for _ in range(35):
                  r=subprocess.run(['gh','api','repos/'+os.environ['REPO']+'/actions/workflows/全部.yml/runs?per_page=50'],capture_output=True,text=True,check=True)
                  runs=json.loads(r.stdout)['workflow_runs']
                  if not any(x['status'] in ('pending','queued','waiting') for x in runs):break
                  time.sleep(30)
              else:raise RuntimeError('登録待機が解消しないため起動しない')
          else:
              assert inp.get('mode') in ('dry','send') and inp.get('execution')=='single'
              assert set(inp)==set(('ids_file','mode','execution'))
              assert inp['ids_file'].startswith('送付便/20261026_GoogleMeta_')
          args=['gh','workflow','run',c['workflow'],'-R',os.environ['REPO'],'--ref',c['ref']]
          for k,v in inp.items():args+=['-f',k+'='+v]
          subprocess.run(args,check=True)
          print(json.dumps({'command_id':c['command_id'],'workflow':c['workflow'],'inputs':inp},ensure_ascii=False))
          PY
