# 動画広告Proに1回だけログインし、タブを何枚か並べて業種の言葉ごとの広告一覧データを読む。2026-10-26 勝良さん決定「サーバーで何本も並べて集める」。
# ログインは1つだけ（同時に2つ動かさない）。止まる表示が出たら終了コード2で終わる。
# ID・パスワードは、1Passwordの準備ができたら1Passwordの項目から読む形に切り替える（2026-10-26 勝良さん指示「ワンパスワードのやつでやってほしい」）。
name: 動画広告Proを並べて読む
on:
  workflow_dispatch:
    inputs:
      words:
        description: 検索する言葉（カンマ区切り）
        required: true
      tabs:
        description: 並べるタブの数（最初は2〜3）
        required: false
        default: '2'
      intervals:
        description: 期間（日数、カンマ区切り）
        required: false
        default: '30,90'
      pages:
        description: 1検索あたり、表を下へ送る回数の上限（1回で約100件）
        required: false
        default: '15'
concurrency:
  group: douga-login
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 1Passwordの準備ができたら、下の2行を消し、1Password公式の読み込み（1password/load-secrets-action@v2、op://保管庫名/項目名/username・password）に切り替える。
      # 10/26 22:15 勝良さん「全部並行して進めろよ」：それまでは今のSecretsで回す。
      - name: 読む
        timeout-minutes: 85
        env:
          DOUGA_PRO_ID: ${{ secrets.DOUGA_PRO_ID }}
          DOUGA_PRO_PASSWORD: ${{ secrets.DOUGA_PRO_PASSWORD }}
          WORDS: ${{ inputs.words }}
          TABS: ${{ inputs.tabs }}
          INTERVALS: ${{ inputs.intervals }}
          PAGES: ${{ inputs.pages }}
        run: node 広告候補集め/動画広告Pro_並列.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 動画広告Pro_並列
          path: 記録/動画広告Pro_並列/
          retention-days: 14
