# 動画広告Proに1回だけログインし、タブを何枚か並べて業種の言葉ごとの広告一覧データを読む。2026-10-26 勝良さん決定「サーバーで何本も並べて集める」。
# ログインは1つだけ（同時に2つ動かさない）。止まる表示が出たら終了コード2で終わる。
# ID・パスワードは1Passwordの項目（保管庫 GitHub・項目 dpro.kashika-20mile.com）から読む（2026-10-26 勝良さん指示「ワンパスワードのやつでやってほしい」）。値は伏せ字になりログに出ない。
# GitHubに置くのは、読み取り専用のサービスアカウントのトークン（Secrets の OP_SERVICE_ACCOUNT_TOKEN）だけ。DOUGA_PRO_ID・PASSWORD は、1Passwordから読めない時だけ使う。
name: 動画広告Proを並べて読む
on:
  workflow_dispatch:
    inputs:
      words:
        description: 検索する言葉（カンマ区切り）
        required: false
        default: ''
      combos:
        description: 「言葉|期間|並べ替え」を ; で区切った組み合わせ（あれば words より優先）
        required: false
        default: ''
      tabs:
        description: 並べるタブの数（最初は2〜3）
        required: false
        default: '2'
      intervals:
        description: 期間（日数、カンマ区切り）
        required: false
        default: '30,90'
      pages:
        description: 1検索あたり、表を下へ送る回数の上限（1回で約100件）
        required: false
        default: '30'
      lane:
        description: 何本目か（1か2。同時のログインは2つまで）
        required: false
        default: '1'
      start:
        description: 組み合わせの表（広告候補集め/動画広告Pro_組み合わせ.txt）の何行目から（空なら combos・words を使う）
        required: false
        default: ''
      chain:
        description: 終わったら次の回を自分で起動する
        required: false
        default: 'false'
      delay:
        description: 始める前に待つ秒数（止まった後の再開用）
        required: false
        default: '0'
      only_1password:
        description: 1Passwordから読めるかだけ確かめる（動画広告Proには触らない）
        required: false
        default: 'false'
concurrency:
  group: ${{ inputs.only_1password == 'true' && 'op-check' || (inputs.lane == '2' && 'douga-login-2' || 'douga-login') }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: 待つ（止まった後の再開）
        if: inputs.delay != '0'
        run: sleep ${{ inputs.delay }}
      - name: この回の組み合わせを決める
        id: pick
        env:
          START: ${{ inputs.start }}
          TABS: ${{ inputs.tabs }}
          LANE: ${{ inputs.lane }}
        run: |
          F=広告候補集め/動画広告Pro_組み合わせ.txt; N=$(grep -c . $F); H=$((N/2))
          if [ -z "$START" ]; then echo "combos=${{ inputs.combos }}" >> $GITHUB_OUTPUT; exit 0; fi
          # 1本目は表の前半、2本目は後半を受け持ち、重ならないようにする
          if [ "$LANE" = 2 ]; then lo=$H; hi=$N; else lo=0; hi=$H; fi
          i=$START; [ $i -lt $lo -o $i -ge $hi ] && i=$lo
          k=$((TABS*15)); j=$((i+k)); [ $j -gt $hi ] && j=$hi
          echo "combos=$(sed -n "$((i+1)),${j}p" $F | paste -sd';' -)" >> $GITHUB_OUTPUT
          nx=$j; [ $nx -ge $hi ] && nx=$lo; echo "next=$nx" >> $GITHUB_OUTPUT
          echo "組み合わせ $((i+1))〜$j（${LANE}本目）"
      - name: 1PasswordからID・パスワードを読む
        id: op
        continue-on-error: true
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOUGA_PRO_ID: op://GitHub/dpro.kashika-20mile.com/username
          DOUGA_PRO_PASSWORD: op://GitHub/dpro.kashika-20mile.com/password
      - name: 読めたかを確かめる（値は出さない）
        env:
          OLD_ID: ${{ secrets.DOUGA_PRO_ID }}
          OLD_PW: ${{ secrets.DOUGA_PRO_PASSWORD }}
        run: |
          if [ -n "$DOUGA_PRO_ID" ] && [ -n "$DOUGA_PRO_PASSWORD" ]; then echo "1Passwordから読めた"; exit 0; fi
          echo "1Passwordから読めなかった"
          [ "${{ inputs.only_1password }}" = "true" ] && exit 1
          # 10/26 22:15 勝良さん「全部並行して進めろよ」：1Passwordが読めるまでは、今のSecretsで回す
          echo "今のSecrets（DOUGA_PRO_ID・PASSWORD）で回す"
          echo "DOUGA_PRO_ID=$OLD_ID" >> "$GITHUB_ENV"; echo "DOUGA_PRO_PASSWORD=$OLD_PW" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: inputs.only_1password != 'true'
        with:
          node-version: 22
          check-latest: true
      - run: npm ci
        if: inputs.only_1password != 'true'
      - run: npx playwright install --with-deps chromium
        if: inputs.only_1password != 'true'
      - name: 読む
        id: read
        if: inputs.only_1password != 'true'
        timeout-minutes: 85
        env:
          WORDS: ${{ inputs.words }}
          COMBOS: ${{ steps.pick.outputs.combos }}
          TABS: ${{ inputs.tabs }}
          INTERVALS: ${{ inputs.intervals }}
          PAGES: ${{ inputs.pages }}
        run: node 広告候補集め/動画広告Pro_並列.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.only_1password != 'true'
        with:
          name: 動画広告Pro_並列
          path: 記録/動画広告Pro_並列/
          retention-days: 14
      - name: 次の回を起動する（止まった時は、2本とも止めて30分後に1本・タブ2枚で再開）
        if: always() && inputs.chain == 'true' && inputs.only_1password != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ inputs.lane }}
          TABS: ${{ inputs.tabs }}
          NEXT: ${{ steps.pick.outputs.next }}
          OUTCOME: ${{ steps.read.outcome }}
        run: |
          W=douga-parallel.yml
          if [ "$OUTCOME" = success ]; then
            t=4
            gh workflow run $W -R $GITHUB_REPOSITORY -f lane=$LANE -f start=$NEXT -f tabs=$t -f chain=true
            echo "次：${LANE}本目 タブ$t 組み合わせ$((NEXT+1))〜"
          elif [ "$OUTCOME" != failure ]; then
            echo "取り消された回・読む前に終わった回（$OUTCOME）。次は起動しない"
          else
            echo "止まった（$OUTCOME）。2本とも止めて、30分後に1本・タブ2枚で再開する"
            for id in $(gh run list -R $GITHUB_REPOSITORY --workflow $W --json databaseId,status -q '.[]|select(.status!="completed")|.databaseId'); do
              [ "$id" != "$GITHUB_RUN_ID" ] && gh run cancel $id -R $GITHUB_REPOSITORY || true
            done
            gh workflow run $W -R $GITHUB_REPOSITORY -f lane=1 -f start=$NEXT -f tabs=2 -f chain=true -f delay=1800
          fi
