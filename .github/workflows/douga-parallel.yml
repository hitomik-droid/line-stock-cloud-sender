# 動画広告Proに1回だけログインし、タブを何枚か並べて業種の言葉ごとの広告一覧データを読む。2026-10-26 勝良さん決定「サーバーで何本も並べて集める」。
# ログインは1つだけ（同時に2つ動かさない）。止まる表示が出たら終了コード2で終わる。
# ID・パスワードは1Passwordの項目（保管庫 GitHub用・項目 dpro.kashika-20mile.com）から読む（2026-10-26 勝良さん指示「ワンパスワードのやつでやってほしい」）。値は伏せ字になりログに出ない。
# GitHubに置くのは、読み取り専用のサービスアカウントのトークン（Secrets の OP_SERVICE_ACCOUNT_TOKEN）だけ。DOUGA_PRO_ID・PASSWORD は使わない。
name: 動画広告Proを並べて読む
on:
  workflow_dispatch:
    inputs:
      words:
        description: 検索する言葉（カンマ区切り）
        required: true
      tabs:
        description: 並べるタブの数（最初は2〜3）
        required: false
        default: '2'
      intervals:
        description: 期間（日数、カンマ区切り）
        required: false
        default: '30,90'
      pages:
        description: 1検索あたり、表を下へ送る回数の上限（1回で約100件）
        required: false
        default: '15'
concurrency:
  group: douga-login
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 1PasswordからID・パスワードを読む
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOUGA_PRO_ID: op://GitHub用/dpro.kashika-20mile.com/username
          DOUGA_PRO_PASSWORD: op://GitHub用/dpro.kashika-20mile.com/password
      - name: 読む
        timeout-minutes: 85
        env:
          WORDS: ${{ inputs.words }}
          TABS: ${{ inputs.tabs }}
          INTERVALS: ${{ inputs.intervals }}
          PAGES: ${{ inputs.pages }}
        run: node 広告候補集め/動画広告Pro_並列.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 動画広告Pro_並列
          path: 記録/動画広告Pro_並列/
          retention-days: 14
