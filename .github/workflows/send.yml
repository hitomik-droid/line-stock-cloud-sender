# LINEストックのフォーム営業を、GitHubのサーバー（画面を出さないChromium）で送る。
# 手で起動する：Actions の「フォーム営業の送信」→ Run workflow、または gh workflow run send.yml -f ids_file=送付便/xxx.txt
# 送るのは ids_file に書いた会社のうち、ダッシュボードで「確認中」の会社だけ（一括送信.mjs が確かめる）。
name: フォーム営業の送信
on:
  workflow_dispatch:
    inputs:
      ids_file:
        description: 送る会社IDの一覧（カンマ区切り）のファイル。例：送付便/20261022_残り.txt
        required: true
      mode:
        description: send＝送信まで行う／dry＝入力だけして止める
        required: true
        default: dry
        type: choice
        options: [dry, send]
      execution:
        description: batch＝従来の一括／single＝全社一覧APIを使わず既存の1社送信プログラムを呼ぶ
        required: false
        default: batch
        type: choice
        options: [batch, single]
  # 10/24 「全部.yml」から呼べるようにした。ids に会社IDを直接渡す（ids_file は使わない）
  workflow_call:
    inputs:
      ids:
        description: 送る会社ID（カンマ区切り）
        required: true
        type: string
      mode:
        description: send または dry
        required: true
        type: string
      execution:
        required: false
        type: string
        default: batch
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 送る（4組のうち1組）
        env:
          IDS_FILE: ${{ inputs.ids_file }}
          IDS_IN: ${{ inputs.ids }}
          MODE: ${{ inputs.mode }}
          EXECUTION: ${{ inputs.execution }}
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          mkdir -p 記録
          if [ -n "$IDS_IN" ]; then IDS=$(echo "$IDS_IN" | tr -d '\n '); else IDS=$(tr -d '\n ' < "$IDS_FILE"); fi
          if [ "$EXECUTION" = single ]; then
            printf '%s' "$IDS" | tr ',' '\n' | awk -v p="$PART" '(NR-1)%4==p-1' > "記録/ids_$PART.txt"
            while IFS= read -r id || [ -n "$id" ]; do
              [ -n "$id" ] || continue
              result="記録/single_${PART}_${id}.json"
              node 送信.mjs "$id" --mode="$MODE" > "$result"
              cat "$result"
              # 既存の一括送信と同じく、ステータスを書けなかったらこの組を止める。
              node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1])); if(r.result==="status-failed")process.exit(1)' "$result"
              node -e 'setTimeout(() => {}, 3000)'
            done < "記録/ids_$PART.txt"
            node - <<'JS' | tee "記録/actions_${PART}.log"
            const fs = require('fs');
            const rows = fs.readdirSync('記録').filter(n => n.startsWith('single_' + process.env.PART + '_') && n.endsWith('.json')).map(n => JSON.parse(fs.readFileSync('記録/' + n)));
            for (const r of rows) console.log(`${r.id} ${r.name} → ${r.status || r.result}：${r.note}`);
            const count = s => rows.filter(r => r.status === s).length;
            console.log('\n===== まとめ =====');
            console.log(`送付完了 ${count('送付完了')}／送付失敗 ${count('送付失敗')}／除外 ${count('除外')}／その他 ${rows.filter(r => !r.status).length}`);
          JS
          else
            node 一括送信.mjs --mode="$MODE" --ids="$IDS" --part=${{ matrix.part }}/4 --limit=1000 2>&1 | tee "記録/actions_${{ matrix.part }}.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 記録-${{ matrix.part }}
          path: 記録/
          retention-days: 30
  report:
    needs: send
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: D1の送付完了累計を読む（更新しない）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p 記録
          npx --yes wrangler@4.150.0 d1 execute line-stock-sales --remote --config=登録/wrangler.jsonc --command="SELECT COUNT(*) AS sent, MAX(sent_at) AS last_sent_at, strftime('%Y-%m-%dT%H:%M:%fZ','now') AS checked_at FROM companies WHERE status='送付完了'" --json > 記録/送付累計.json
          node - <<'JS'
          const fs = require('fs');
          const chunks = JSON.parse(fs.readFileSync('記録/送付累計.json'));
          if (!chunks.length || !chunks.every(c => c.success)) throw new Error('D1累計の読取失敗');
          const row = chunks[0].results[0];
          if (!Number.isInteger(row.sent)) throw new Error('D1累計の形式が不正');
          console.log(JSON.stringify(row));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `D1送付完了累計：${row.sent}件（確認：${row.checked_at}）\n`);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 送付累計
          path: 記録/送付累計.json
          retention-days: 30
