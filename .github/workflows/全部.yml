# 候補集め → 公式サイト探し → フォーム検品 → 判定 → D1へ登録 → 送付 を、成果物を取り出さずにGitHub Actionsの中だけで1本で行う（2026-10-24）。
# 使い方は README の「全部.yml」。mode=dry は登録も送付もしない（判定の結果と、D1に入れるSQLの件数・D1の鍵が通るかだけ確かめる）。
# 文面は全部 堀田さんの版（v8）。外す会社の決まりは 登録/判定.py と 登録/流れ.py（README に一覧）。
name: 候補集めから送付まで（全部）
# tag：呼んだ側（在庫づくり.yml）が自分の起動した実行を見分けるための印
run-name: 全部 ${{ inputs.mode }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      source:
        description: 候補の集め方（meta＝Metaの広告ライブラリ／douga＝動画広告Pro／file＝リポジトリにある候補ファイル）
        required: true
        default: meta
        type: choice
        options: [meta, douga, file]
      q:
        description: meta の検索語（業種:語|語;業種:語 の形）。douga の検索語（カンマ区切り）。file の時は候補ファイルのパス（.tsv＝公式サイトとフォームが分かった候補、.json＝候補の元）
        required: true
      douga_objs:
        description: douga の広告の目的（ACQUISITION＝獲得、AWARENESS＝認知）
        required: false
        default: ACQUISITION
      depth:
        description: 読む深さ（meta は1語あたり下へ送る回数、douga は1語あたりのページ数）
        required: false
        default: '15'
      mode:
        description: dry＝判定まで／register＝D1登録のみ／send＝D1に登録して送付まで
        required: true
        default: dry
        type: choice
        options: [dry, register, send]
      sender:
        description: 送った担当（Claude／Codex など）。状態の履歴に残る
        required: false
        default: ''
      id_band:
        description: 動画広告Pro等（Meta以外）の登録番号の帯の始まり。空なら1000番台（10/26 Claude担当は5000）
        required: false
        default: ''
      from_run:
        description: register・send の時、この dry の実行番号の検品結果をそのまま使う（検品をやり直さない）。q・source は使わない
        required: false
        default: ''
      tag:
        description: 実行の名前に付ける印（在庫づくり.yml が使う）
        required: false
        default: ''
      recheck:
        description: 点検し直し（true の時、調べ済み・検品済みドメインでは外さない。D1との重複は外す）
        required: false
        default: 'false'
# 2026-10-26 22時：dry（読むだけ）は組ごとに同時に動かす。D1に書く register・send だけ1本ずつ（番号が重ならないよう）
concurrency:
  group: ${{ inputs.mode == 'dry' && format('line-stock-dry-{0}', github.run_id) || 'line-stock-register' }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      ids: ${{ steps.reg.outputs.ids }}
    env:
      W: 記録/全部
      LS_ID_BAND: ${{ inputs.id_band }}
      LS_RECHECK: ${{ inputs.recheck == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: inputs.from_run == ''
      - name: dry の検品結果を使う（from_run）
        if: inputs.from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.from_run }}
        run: |
          # 10/27 カンマ区切りで複数の dry をまとめて1回で登録できる。key は「dry番号-C001」にして重ならないようにする
          mkdir -p "$W"; : > "$W/まとめたdry.txt"; : > "$W/取れなかったdry.txt"
          for D in $(echo "$RUN" | tr ',' ' '); do
            T=$(mktemp -d)
            gh run download "$D" -R "$GITHUB_REPOSITORY" -n 全部の記録 -D "$T" >/dev/null 2>&1
            if [ -f "$T/cands.json" ] && [ -f "$T/results.jsonl" ]; then mv "$T" "$W/dry_$D"; echo "$D" >> "$W/まとめたdry.txt"; else echo "$D" >> "$W/取れなかったdry.txt"; echo "dry $D に cands.json・results.jsonl が無い"; fi
          done
          [ -s "$W/まとめたdry.txt" ] || { echo "使える dry が無い"; exit 1; }
          python3 - "$W" <<'PY'
          import json, sys
          from pathlib import Path
          w = Path(sys.argv[1]); cands, res = [], []
          def rows(t):  # 10/27 途中で切れた行（dry が書き込み中に止まった）は読み飛ばす
              for l in t.splitlines():
                  try: yield json.loads(l)
                  except ValueError: pass
          for d in (w / 'まとめたdry.txt').read_text().split():
              s = w / f'dry_{d}'
              rs = [{**r, 'key': f"{d}-{r['key']}"} for r in rows((s / 'results.jsonl').read_text())]
              have = {r['key'] for r in rs}
              cands += [x for x in ({**c, 'key': f"{d}-{c['key']}"} for c in json.loads((s / 'cands.json').read_text())) if x['key'] in have]
              res += rs
          (w / 'cands.json').write_text(json.dumps(cands, ensure_ascii=False))
          (w / 'results.jsonl').write_text(''.join(json.dumps(r, ensure_ascii=False) + '\n' for r in res))
          PY
          mv "$W"/dry_* "$RUNNER_TEMP"/
          echo "dry $(tr '\n' ' ' < "$W/まとめたdry.txt")の検品結果を使う：$(wc -l < "$W/results.jsonl") 件。検品しない（判定・番号はD1を読み直して決める。同じ会社は1回だけ）"
      - name: 候補を集める（meta）
        if: inputs.source == 'meta' && inputs.from_run == ''
        env:
          Q: ${{ inputs.q }}
          SCROLL: ${{ inputs.depth }}
        run: |
          mkdir -p "$W/tsv" 記録/Meta集め/出力
          node 広告候補集め/meta/meta.mjs --scroll="$SCROLL" "--q=$Q" --out=記録/Meta集め/出力/meta_候補.json
          for i in 0 1 2 3; do
            node 広告候補集め/meta/公式サイト確定.mjs --skiplogged --per=999 --in=記録/Meta集め/出力/meta_候補.json --shard=$i/4 --out="$W/tsv/meta_$i.tsv" > "$W/確定ログ_meta_$i.txt" 2>&1 &
          done
          wait
      - name: 候補を集める（douga：動画広告Proを読む）
        if: inputs.source == 'douga' && inputs.from_run == ''
        timeout-minutes: 60
        env:
          DOUGA_PRO_ID: ${{ secrets.DOUGA_PRO_ID }}
          DOUGA_PRO_PASSWORD: ${{ secrets.DOUGA_PRO_PASSWORD }}
          WORDS: ${{ inputs.q }}
          OBJS: ${{ inputs.douga_objs }}
          PAGES: ${{ inputs.depth }}
        run: |
          mkdir -p "$W"
          node 広告候補集め/動画広告Pro_集め.mjs
          curl -s -A "Mozilla/5.0" https://line-stock-product-plan.hitomi-k.workers.dev/api/sales -o "$W/sales.json"
          python3 登録/候補の元を作る.py 記録/動画広告Pro_集め/広告一覧データ.json "$W/sales.json" "$W/候補の元.json"
      - name: 候補ファイルを使う（file）
        if: inputs.source == 'file' && inputs.from_run == ''
        env:
          F: ${{ inputs.q }}
        run: |
          mkdir -p "$W/tsv"
          case "$F" in
            *.tsv) cp "$F" "$W/tsv/file.tsv" ;;
            *.json)
              python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['F']).read_text())
          work = Path(os.environ['W'])
          if isinstance(data, dict) and data.get('schema') == 'line-stock-saved-inspection/1':
              cands, results = data['cands'], data['results']
              assert len({c['key'] for c in cands}) == len(cands), '候補keyの重複'
              assert {r['key'] for r in results} == {c['key'] for c in cands}, '候補と検品結果の不一致'
              assert all(not (c.get('list_source') or '').startswith('Meta') for c in cands), 'この再開入力は1000番台のみ'
              (work / 'cands.json').write_text(json.dumps(cands, ensure_ascii=False))
              (work / 'results.jsonl').write_text('\n'.join(json.dumps(r, ensure_ascii=False) for r in results) + '\n')
              print(f'保存済み検品結果を使用：{len(cands)}社。再検品しない')
          else:
              (work / '候補の元.json').write_text(json.dumps(data, ensure_ascii=False))
          PY
              ;;
            *) echo "候補ファイルは .tsv か .json"; exit 1 ;;
          esac
      # 10/27 勝良さん「1 作る」：広告の行き先がSNS等で公式サイトが分からない会社だけ、社名で Brave Search API を引く（無料の範囲：1日30回まで、同じ社名は引かない）
      - name: Brave Search API の鍵を1Passwordから読む（値は出さない）
        id: brave
        if: inputs.from_run == ''
        continue-on-error: true
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          BRAVE_API_KEY: op://GitHub/Brave Search API/credential
      - name: 公式サイトが分からない会社を社名で探す
        if: inputs.from_run == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -f "$W/候補の元.json" ] || exit 0
          [ -n "${BRAVE_API_KEY:-}" ] && echo "Braveの鍵：読めた" || echo "Braveの鍵：読めない（社名検索はしない）"
          python3 登録/公式サイトを名前で探す.py "$W/候補の元.json" | tee "$W/社名検索.txt" || echo "社名検索はできなかった（D1が読めない等）。そのまま進める"
      - name: 公式サイトと問い合わせフォームを探す（douga・file の .json。16に分けて同時に）
        timeout-minutes: 90
        run: |
          [ -f "$W/候補の元.json" ] || exit 0
          mkdir -p "$W/tsv"
          N=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.W+'/候補の元.json')).length)")
          echo "公式サイトを探す会社 $N"
          # 10/27 GitHubの同時の枠が約6本しか取れないため、1本の中で16に分けて同時に探す
          PER=$(( (N + 15) / 16 ))
          for p in $(seq 1 16); do
            FROM=$(( (p - 1) * PER )); TO=$(( FROM + PER ))
            node 広告候補集め/候補化/公式サイト確定.mjs --in="$W/候補の元.json" --from=$FROM --to=$TO --per=9999 --log="$W/確定ログ_$p.jsonl" --out="$W/tsv/kakutei_$p.tsv" > "$W/確定_$p.txt" 2>&1 &
          done
          wait
      # 公開APIが503でも、既存のD1接続で同じ会社情報を読む。判定/SQL生成は既存のまま。
      - &read_d1
        name: D1の最新会社情報を読む
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p "$W"
          # 10/27 D1の無料枠（1日に読める行数）を越えた時、dry は D1 なしで進める（重複は登録の直前にD1を読み直して外す）。register・send は今までどおり止まる
          if ! npx --yes wrangler@4.150.0 d1 execute line-stock-sales --remote --config=登録/wrangler.jsonc --command="SELECT id,name,legal_name,official_url,form_url,status FROM companies" --json > "$W/D1読取.json"; then
            if [ "${{ inputs.mode }}" = dry ]; then echo "D1が読めない。dry なので D1 なしで進める（重複は登録の時に外す）"; echo '{"companies":[]}' > "$W/sales.json"; echo "LS_API=file://$PWD/$W/sales.json" >> "$GITHUB_ENV"; exit 0; fi
            echo "D1が読めない"; exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          w = Path(os.environ['W'])
          chunks = json.loads((w / 'D1読取.json').read_text())
          assert chunks and all(c.get('success') for c in chunks), 'D1読取に失敗'
          rows = [r for c in chunks for r in c['results']]
          assert all('id' in r and 'status' in r for r in rows), 'D1会社情報が不正'
          (w / 'sales.json').write_text(json.dumps({'companies': rows}, ensure_ascii=False))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('LS_API=' + (w / 'sales.json').resolve().as_uri() + '\n')
          print(f'D1から最新の会社情報を読取：{len(rows)}社（読み取りのみ）')
          PY
      - name: D1・調べ済みと重ならない候補だけにする
        if: hashFiles('記録/全部/results.jsonl') == ''
        run: python3 登録/流れ.py cands "$W" "$W"/tsv/*.tsv
      - name: フォームを検品する（送信ボタンは押さない。12に分けて同時に）
        if: hashFiles('記録/全部/results.jsonl') == ''
        timeout-minutes: 80
        run: |
          N=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.W+'/cands.json')).length)")
          if [ "$N" = 0 ]; then : > "$W/results.jsonl"; exit 0; fi
          for p in $(seq 1 12); do
            node 広告候補集め/候補化/フォーム検品.mjs "$W/cands.json" "$W/検品_$p.jsonl" 3 $p/12 > "$W/検品_$p.txt" 2>&1 &
          done
          wait
          cat "$W"/検品_*.jsonl > "$W/results.jsonl"
      - *read_d1
      - name: 判定して、番号・文面を決める
        run: python3 登録/流れ.py plan "$W"
      - name: D1に登録する（send）／D1の鍵だけ確かめる（dry）
        id: reg
        working-directory: 登録
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          IDS=$(cat "../$W/ids.txt")
          if [ "$MODE" != dry ] && [ -n "$IDS" ]; then
            npx --yes wrangler@4.150.0 d1 execute line-stock-sales --remote --file="../$W/投入.sql" > "../$W/登録ログ.txt" 2>&1 || { tail -5 "../$W/登録ログ.txt"; exit 1; }
            npx --yes wrangler@4.150.0 d1 execute line-stock-sales --remote --command="SELECT id,name,legal_name,official_url,form_url,status FROM companies" --json > "../$W/D1読取.json"
            python3 -c 'import json,sys; from pathlib import Path; w=Path(sys.argv[1]); chunks=json.loads((w/"D1読取.json").read_text()); assert chunks and all(c.get("success") for c in chunks); rows=[r for c in chunks for r in c["results"]]; assert rows; (w/"sales.json").write_text(json.dumps({"companies":rows},ensure_ascii=False))' "../$W"
            python3 流れ.py check "../$W"
            echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          else
            # 10/27 全件を数える問い合わせはD1の読み取り行数を使うので、dry では鍵の確認をしない
            echo "dry：登録・送付はしない（合格 $(echo "$IDS" | tr ',' '\n' | grep -c . ) 社）"
          fi
      - name: 公開広告の参照情報を残す
        if: always() && inputs.source == 'meta' && inputs.from_run == ''
        run: |
          python3 - <<'PYREF'
          import json
          from pathlib import Path
          src = Path('記録/Meta集め/出力/meta_候補.json')
          if src.exists():
              rows = json.loads(src.read_text())
              assert isinstance(rows, list) and all(isinstance(r, dict) for r in rows), '広告原本の形式が不正'
              keys = ('industry', 'name', 'landing', 'source_url', 'ad_evidence_url', 'library_id', 'page_id', 'ads', 'words', 'skip')
              dest = Path('記録/全部/Meta参照原本.json')
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(json.dumps([{k: r[k] for k in keys if k in r} for r in rows], ensure_ascii=False, indent=1))
              print(f'公開広告の参照情報を保存：{len(rows)}行')
          else:
              print('広告原本なし：参照情報は未保存')
          PYREF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 全部の記録
          path: 記録/全部/
          retention-days: 14
  send:
    needs: prepare
    if: inputs.mode == 'send' && needs.prepare.outputs.ids != ''
    uses: ./.github/workflows/send.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    with:
      ids: ${{ needs.prepare.outputs.ids }}
      mode: send
      sender: ${{ inputs.sender }}
